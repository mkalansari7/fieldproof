[project]
name = "fieldproof"
version = "0.1.0"
description = "Location-verified visit tracking"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "fastapi>=0.115",
]

[project.optional-dependencies]
# httpx is not an optional test convenience: it is the only way to drive an ASGI
# app in-process, and every trust-boundary test in `test_api.py` has to go
# through the real request path to be testing the boundary at all.
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# ruff formats Python blocks inside Markdown. spec.md holds deliberate pseudocode
# that is not valid Python, so docs are the spec's business, not the formatter's.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear — real bugs, not style
    "ASYNC", # blocking calls inside async def
    "DTZ",   # naive datetimes
    "C4",    # comprehensions
    "SIM",   # simplify
    "PT",    # pytest style
    "S",     # bandit
    "RUF",
]
ignore = [
    "E501", # line length is the formatter's job; leaving it on picks fights with long strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is the point of a test
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "ignore-without-code", # a bare `# type: ignore` hides the next bug too
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable", # a forgotten await in the sweeper fails silently
]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
